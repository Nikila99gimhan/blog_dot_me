const details={
 engineer:{copy:'The engineer understands the local request but lacks organization-wide consumer knowledge. This scenario changes an approved private subnet default.',boundary:'Candidate branch content is evidence. It does not own the trusted policy evaluator or approval process.'},
 checks:{copy:'A successful build and policy script confirm only the encoded checks for the evaluated inputs. A permitted subnet can still be incompatible with consumer-specific DNS or routing assumptions.',boundary:'Keep the deterministic result. Add consumer-specific evaluation for the new question.'},
 merged:{copy:'This risky path assumes existing reviewers and required checks do not ask for downstream impact evidence. The change is therefore eligible for merge under those limited controls.',boundary:'The remedy is an enforced impact requirement for critical changes, not a prompt that asks an agent to be careful.'},
 sync:{copy:'The consumer retrieves main/latest during its next synchronization or build. Effective production impact then depends on its version resolution, configuration and deployment.',boundary:'Avoid silent mutable references for releases. Protected main alone cannot validate every consumer.'},
 payments:{copy:'Illustrative payment services depend on the shared module. A subnet default change may alter private endpoint placement and require consumer-specific connectivity validation.',boundary:'Neither a reference nor a sync proves an outage. Evaluate the plan, overrides and actual rollout.'},
 ordering:{copy:'Illustrative ordering services may rely on different routing and identity assumptions than payment services.',boundary:'Retain each consumer’s source version, deployment scope, owner and relevant plan.'},
 customer:{copy:'Illustrative customer APIs span regional configurations. New private-network defaults may require DNS links or existing network relationships.',boundary:'Inspect effective consumer configuration and relevant evidence; do not infer identical impact across regions.'},
 analytics:{copy:'Illustrative analytics pipelines may adopt the change later. Data flow disruption is a possible consequence to evaluate.',boundary:'A missing consumer record is unknown coverage, not a safe or unaffected deployment.'},
 candidate:{copy:'The impact request contains the proposed module diff, source repository and exact candidate commit. It is evaluated against a trusted base policy and automation version.',boundary:'A new push invalidates evidence and reviews tied to the previous candidate.'},
 green:{copy:'The existing compliance check still runs and may be green. Classification runs separately because shared-module risk is a different question.',boundary:'Changing the investigation trigger must not weaken or rewrite the original policy result.'},
 classifier:{copy:'Add rules for protected module paths, interface/default changes, networking, identity, deployment scope and incomplete coverage. Start with a small trusted rule set.',code:'Proposed file: policy/change-risk.json\n\n{\n  "criticalPaths": ["modules/**", "infra/modules/**"],\n  "reviewChanges": ["defaults", "outputs", "network", "identity"],\n  "investigateWhen": "critical_or_unknown",\n  "missingEvidence": "block"\n}\n\nDesign sketch: application policy, not gh-aw syntax.',boundary:'The classifier is deterministic and tested. The candidate must not be able to weaken its own classifier.'},
 sources:{copy:'A collector combines authoritative consumer records with version resolution, effective parameters, ownership and relevant Bicep what-if / Terraform plan summaries.',boundary:'What-if may be incomplete. Coverage and freshness must be explicit; approval uses the actual evaluated scope.'},
 investigator:{copy:'An impact workflow reuses the governed investigation pattern. It reads a bounded package and explains differences, possible causes, affected patterns and missing evidence.',boundary:'Use an agent only when the contextual question justifies inference. It cannot approve exceptions or obtain broader access.'},
 gate:{copy:'Require impact evidence and owners for this candidate. Check source identity, consumer coverage, destructive findings, output validity and approvals.',code:'Proposed check: impact-evidence\n\nPASS: required evidence + approvals present\nHOLD: missing consumers / stale plans / approval pending\nBLOCK: disallowed or unapproved destructive changes\n\nUpdate repository rulesets to require the check.\nKeep rollout gates in each consumer repository.',boundary:'A successful agent job is not approval. Attach the check to the correct current SHA; an unrelated workflow_run result cannot satisfy it automatically.'},
 workflow:{copy:'Add a deterministic diff classifier to CI. Define a separate impact workflow using reviewed source and compile it with the installed gh-aw toolchain.',code:'Proposed changes\n\n.github/workflows/ci.yml\n  → build, policy, classify-change, package evidence\n\n.github/workflows/module-impact.md\n  → reviewed trigger, tools, budgets, output rules\n\n.github/workflows/module-impact.lock.yml\n  → generated by gh aw compile --validate\n\nscripts/classify-module-change.ts\npolicy/change-risk.json\n\nSelect a supported trigger: PR event, or a completed\nCI run accepting both success and failure.\nNo failure-only activation filter for critical changes.',boundary:'This is a design mapping. Validate syntax against the installed compiler. Privileged jobs execute trusted automation, not candidate package scripts.'},
 collector:{copy:'Resolve each authorized consumer’s actual module source and version, overrides and plan reference. Bound batches and retries and record every missing result.',code:'Proposed files\nscripts/collect-module-impact.ts\ncontracts/module-impact.schema.json\n\nEvidence manifest\nsource: { repo, run, attempt, sha, module, policyVersion }\ncoverage: { expected, evaluated, missing, sourceVersion }\nconsumers: [{ repo, resolvedVersion, scope, overrides,\n              planRef, owner, status }]\n\nA bounded summary links to detailed artifacts.\nDo not silently truncate the consumer coverage list.',boundary:'Use credentials limited to the installation’s allowed repositories. GITHUB_TOKEN alone does not grant organization-wide repository access.'},
 inventory:{copy:'Use a maintained dependency inventory and verified manifests. Read allowed repository content using an installation GitHub App. Have a separate trusted job produce Azure what-if or Terraform plan artifacts.',code:'Illustrative consumer outcomes\n\npayments-infra  → candidate SHA, default inherited\nordering-infra  → old version, candidate not resolved\ncustomer-infra  → candidate + explicit override\nanalytics-infra → deployment evidence unavailable\n\nClassify: potentially changed / unchanged by this\ncandidate / requires evaluation / unknown.',boundary:'Cloud plan preview may require elevated permissions. Keep that capability in its controlled evaluator; let the agent read the result rather than inherit the cloud credential.'},
 mcp:{copy:'Preserve the existing policy-context tool. Add a resolver for the scoped consumer-impact question where justified. The server verifies identity and derives permitted repository/account scope.',code:'Proposed tool responsibilities\n\nget_investigation_context (existing policy question)\nget_module_impact_context (proposed batch resolver)\n\nInput: module, candidateSha, authorized manifest ref\nServer: authenticate → authorize → resolve → bound\nOutput: policy context, consumers, plans, unknowns\n\nTTL cache key: scope + source version + module version\nAuthorization is checked even when data is cached.',boundary:'The agent does not crawl all repositories by default. It requests only allowed evidence. Never treat a caller-supplied scope string or read-only annotation as authorization.'},
 copilot:{copy:'The agent starts from the normalized evidence, compares resolved versions and effective inputs, and asks only for a remaining gap. It separates facts, hypotheses and unknowns.',code:'Proposed agent instructions\n\n1. Verify source identity and coverage metadata.\n2. Explain observed consumer and plan differences.\n3. Cite the supporting artifact or manifest entry.\n4. Mark unavailable evidence UNKNOWN.\n5. Name owners and required review.\n6. Propose impact.json + short report.\n7. Do not approve merge, deploy or modify policy.',boundary:'Repository files, logs and tool results are untrusted content. They cannot change the allowed operation, scope or destination.'},
 writer:{copy:'Process the proposal through configured detection and output validation. The permitted writer delivers the report. A separate gate evaluates structured evidence and owner approval for the current candidate.',code:'Proposed output integration\n\nimpact.json → schema + evidence checks\nreport proposal → detection + destination checks\nscoped writer → permitted PR comment / artifact\nrequired check → current SHA + coverage + approvals\n\nReruns: explicit event identity and replay handling.\nNew commits: invalidate stale results.\nMissing coverage: HOLD, never automatic PASS.',boundary:'The writer’s actual credential and destination controls must enforce its scope. Publishing a comment alone does not enforce merge protection.'}

function linesText(lines,x,y,size=18,color=C.muted,lineHeight=25){return lines.map((v,i)=>`<text x="${x}" y="${y+i*lineHeight}" font-size="${size}" fill="${color}">${esc(v)}</text>`).join('');}
function nodeSVG(n,active){const tone=C[n.tone]||C.blue;return `<g class="selectable" role="button" tabindex="0" data-node="${n.id}" aria-label="Inspect ${esc(n.title)}" opacity="${active?1:.65}"><rect class="box" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="10" fill="#fff" stroke="${active?tone:C.line}" stroke-width="${active?2.5:1.5}"/><svg x="${n.x+18}" y="${n.y+19}" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="${tone}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[n.icon]}</svg><text x="${n.x+58}" y="${n.y+39}" font-size="21" font-weight="700" fill="${C.ink}">${esc(n.title)}</text>${linesText(n.lines,n.x+19,n.y+74,17,C.muted,24)}<text x="${n.x+19}" y="${n.y+n.h-14}" font-size="12" font-weight="700" letter-spacing=".7" fill="${tone}">${esc(n.tag)}</text></g>`;}
function renderScene(view,index=0,overview=false){const d=views[view],step=d.steps[index],activeNodes=new Set(overview?d.nodes.map(n=>n.id):step.nodes),activeEdges=new Set(overview?d.edges.map(e=>e.id):step.edges);return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 610" role="group" aria-label="${esc(d.title)}" style="font-family:Arial,Helvetica,sans-serif"><defs>${Object.entries(C).filter(([k])=>['blue','red','green','purple'].includes(k)).map(([k,c])=>`<marker id="arrow-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="${c}"/></marker>`).join('')}</defs><rect width="1600" height="610" fill="#fff"/>${d.edges.map(e=>`<path class="edge ${activeEdges.has(e.id)&&!overview?'live':''}" d="${e.d}" fill="none" stroke="${C[e.tone]}" stroke-width="${activeEdges.has(e.id)?2.6:1.8}" opacity="${activeEdges.has(e.id)?1:.3}" ${e.id==='request'?`marker-start="url(#arrow-${e.tone})"`:''} marker-end="url(#arrow-${e.tone})"/>`).join('')}${d.edges.filter(e=>e.label).map(e=>`<text x="${e.x}" y="${e.y}" text-anchor="${e.id==='hydrate'?'start':e.id==='proposal'?'end':'middle'}" font-size="15" font-weight="600" fill="${C[e.tone]}" paint-order="stroke" stroke="#fff" stroke-width="8" stroke-linejoin="round">${esc(e.label)}</text>`).join('')}${d.nodes.map(n=>nodeSVG(n,activeNodes.has(n.id))).join('')}<path d="M48 566H1552" stroke="${C.line}"/><text x="48" y="596" font-size="17" fill="${C.muted}">${esc(d.note)}</text></svg>`;}
globalThis.Scenario={views,details,renderScene};
if(typeof document==='undefined')return;
const q=s=>document.querySelector(s);let view='risk',index=0,overview=false,timer=null,returnFocus=null;
function stop(){if(timer){clearInterval(timer);timer=null;}q('#play').textContent='Play';q('#play').setAttribute('aria-pressed','false');}
function resize(){q('#stage').style.transform=`translate(-50%,-50%) scale(${Math.min(innerWidth/1600,innerHeight/900)})`;}
function render(){const d=views[view],step=d.steps[index];q('#title').textContent=d.title;q('#subtitle').textContent=d.subtitle;q('#scene').innerHTML=renderScene(view,index,overview);q('#counter').textContent=overview?'ALL':`${index+1}/${d.steps.length}`;q('#step-title').textContent=overview?'Explore this view':step.title;q('#step-copy').textContent=overview?'Click a component to inspect its evidence, authority and suggested implementation. Return to steps to follow the arrows.':step.copy;q('#back').disabled=index===0;q('#next').disabled=index===d.steps.length-1;q('#all').setAttribute('aria-pressed',String(overview));q('#all').textContent=overview?'Steps':'Overview';document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===view)));q('#scene').querySelectorAll('[data-node]').forEach(n=>{n.addEventListener('click',()=>open(n.dataset.node,n));n.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();e.stopPropagation();open(n.dataset.node,n);}});});}
function close(){q('#drawer').hidden=true;returnFocus?.focus();}
function open(id,source){stop();returnFocus=source;const d=details[id]||{copy:'Illustrative architecture responsibility.',boundary:'Verify scope and evidence in the implementation.'};const n=views[view].nodes.find(n=>n.id===id);q('#detail-kind').textContent=view==='internal'?'Proposed workflow integration':'Scenario responsibility';q('#detail-title').textContent=n.title;q('#detail-copy').textContent=d.copy;q('#detail-code').innerHTML=d.code?`<pre>${esc(d.code)}</pre>`:'';q('#detail-boundary').textContent=d.boundary;q('#detail-resources').innerHTML=view==='internal'?docs.map(([l,u])=>`<a href="${u}" target="_blank" rel="noopener">${l}</a>`).join(''):'';q('#drawer').hidden=false;q('#close').focus();}
function changeView(v){stop();view=v;index=0;overview=false;q('#drawer').hidden=true;render();}
function go(delta){stop();index=Math.max(0,Math.min(views[view].steps.length-1,index+delta));overview=false;render();}
q('#back').onclick=()=>go(-1);q('#next').onclick=()=>go(1);q('#all').onclick=()=>{stop();overview=!overview;render();};q('#close').onclick=close;document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>changeView(b.dataset.view));q('#play').onclick=()=>{if(timer){stop();return;}overview=false;if(index===views[view].steps.length-1)index=0;render();q('#play').textContent='Pause';q('#play').setAttribute('aria-pressed','true');timer=setInterval(()=>{if(index>=views[view].steps.length-1){stop();return;}index++;render();},6000);};q('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch{q('#full').textContent='Browser full screen';}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){close();stop();return;}if(!q('#drawer').hidden)return;if(['1','2','3'].includes(e.key)){changeView(['risk','governed','internal'][Number(e.key)-1]);return;}if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1);}if(e.key===' '&&!e.target.closest('button,[data-node]')){e.preventDefault();q('#play').click();}});addEventListener('resize',resize);addEventListener('fullscreenchange',resize);resize();render();
})();
</script></body></html>
