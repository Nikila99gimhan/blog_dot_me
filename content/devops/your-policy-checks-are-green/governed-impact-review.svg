<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 610" role="group" aria-label="Add an impact gate for critical module changes." style="font-family:Arial,Helvetica,sans-serif"><defs><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#0969da"/></marker><marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#cf222e"/></marker><marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#1a7f37"/></marker><marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7652b5"/></marker></defs><rect width="1600" height="610" fill="#fff"/><path class="edge " d="M368 93H504" fill="none" stroke="#0969da" stroke-width="2.6" opacity="1"  marker-end="url(#arrow-blue)"/><path class="edge " d="M824 93H980" fill="none" stroke="#0969da" stroke-width="2.6" opacity="1"  marker-end="url(#arrow-blue)"/><path class="edge " d="M1190 162V240H208V305" fill="none" stroke="#0969da" stroke-width="2.6" opacity="1"  marker-end="url(#arrow-blue)"/><path class="edge " d="M368 399H504" fill="none" stroke="#7652b5" stroke-width="2.6" opacity="1"  marker-end="url(#arrow-purple)"/><path class="edge " d="M824 399H980" fill="none" stroke="#0969da" stroke-width="2.6" opacity="1"  marker-end="url(#arrow-blue)"/><text x="436" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#0969da" paint-order="stroke" stroke="#fff" stroke-width="8" stroke-linejoin="round">branch checks</text><text x="902" y="78" text-anchor="middle" font-size="15" font-weight="600" fill="#0969da" paint-order="stroke" stroke="#fff" stroke-width="8" stroke-linejoin="round">all critical diffs</text><text x="710" y="227" text-anchor="middle" font-size="15" font-weight="600" fill="#0969da" paint-order="stroke" stroke="#fff" stroke-width="8" stroke-linejoin="round">assemble impact evidence even when CI is green</text><text x="436" y="383" text-anchor="middle" font-size="15" font-weight="600" fill="#7652b5" paint-order="stroke" stroke="#fff" stroke-width="8" stroke-linejoin="round">bounded context</text><text x="902" y="383" text-anchor="middle" font-size="15" font-weight="600" fill="#0969da" paint-order="stroke" stroke="#fff" stroke-width="8" stroke-linejoin="round">validated report</text><g class="selectable" role="button" tabindex="0" data-node="candidate" aria-label="Inspect Candidate change" opacity="1"><rect class="box" x="48" y="24" width="320" height="138" rx="10" fill="#fff" stroke="#0969da" stroke-width="2.5"/><svg x="66" y="43" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#0969da" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="4" r="3"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="20" r="3"/><path d="M6 7v10M18 9c0 5-12 2-12 8"/></svg><text x="106" y="63" font-size="21" font-weight="700" fill="#14233a">Candidate change</text><text x="67" y="98" font-size="17" fill="#59697b">Branch + commit SHA</text><text x="67" y="122" font-size="17" fill="#59697b">Bicep / Terraform module diff</text><text x="67" y="148" font-size="12" font-weight="700" letter-spacing=".7" fill="#0969da">PROPOSED</text></g><g class="selectable" role="button" tabindex="0" data-node="green" aria-label="Inspect Fast checks pass" opacity="1"><rect class="box" x="504" y="24" width="320" height="138" rx="10" fill="#fff" stroke="#1a7f37" stroke-width="2.5"/><svg x="522" y="43" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#1a7f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="m6 12 4 4 8-9"/></svg><text x="562" y="63" font-size="21" font-weight="700" fill="#14233a">Fast checks pass</text><text x="523" y="98" font-size="17" fill="#59697b">Keep the policy evaluator</text><text x="523" y="122" font-size="17" fill="#59697b">PASS still runs classification</text><text x="523" y="148" font-size="12" font-weight="700" letter-spacing=".7" fill="#1a7f37">GREEN</text></g><g class="selectable" role="button" tabindex="0" data-node="classifier" aria-label="Inspect Deterministic change classifier" opacity="1"><rect class="box" x="980" y="24" width="420" height="138" rx="10" fill="#fff" stroke="#a97400" stroke-width="2.5"/><svg x="998" y="43" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#a97400" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 23 22H1L12 2Z"/><path d="M12 8v7M12 18v1"/></svg><text x="1038" y="63" font-size="21" font-weight="700" fill="#14233a">Deterministic change classifier</text><text x="999" y="98" font-size="17" fill="#59697b">Critical module / default / interface</text><text x="999" y="122" font-size="17" fill="#59697b">High impact or incomplete coverage</text><text x="999" y="148" font-size="12" font-weight="700" letter-spacing=".7" fill="#a97400">IMPACT REVIEW</text></g><g class="selectable" role="button" tabindex="0" data-node="sources" aria-label="Inspect Consumer evidence" opacity="1"><rect class="box" x="48" y="305" width="320" height="188" rx="10" fill="#fff" stroke="#7652b5" stroke-width="2.5"/><svg x="66" y="324" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#7652b5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 4 16 4 16 0V5M4 12v7c0 4 16 4 16 0v-7"/></svg><text x="106" y="344" font-size="21" font-weight="700" fill="#14233a">Consumer evidence</text><text x="67" y="379" font-size="17" fill="#59697b">Resolved versions + overrides</text><text x="67" y="403" font-size="17" fill="#59697b">Scopes, regions and owners</text><text x="67" y="427" font-size="17" fill="#59697b">Plan deltas + missing evidence</text><text x="67" y="479" font-size="12" font-weight="700" letter-spacing=".7" fill="#7652b5">SCOPED INPUTS</text></g><g class="selectable" role="button" tabindex="0" data-node="investigator" aria-label="Inspect Governed investigation" opacity="1"><rect class="box" x="504" y="305" width="320" height="188" rx="10" fill="#fff" stroke="#0969da" stroke-width="2.5"/><svg x="522" y="324" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#0969da" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="15" rx="4"/><path d="M12 2v4M7 14h1M16 14h1M8 18h8"/></svg><text x="562" y="344" font-size="21" font-weight="700" fill="#14233a">Governed investigation</text><text x="523" y="379" font-size="17" fill="#59697b">Copilot + permitted MCP tools</text><text x="523" y="403" font-size="17" fill="#59697b">Facts, hypotheses and unknowns</text><text x="523" y="427" font-size="17" fill="#59697b">Impact report + owner handoff</text><text x="523" y="479" font-size="12" font-weight="700" letter-spacing=".7" fill="#0969da">BOUNDED</text></g><g class="selectable" role="button" tabindex="0" data-node="gate" aria-label="Inspect Required PR impact gate" opacity="1"><rect class="box" x="980" y="305" width="420" height="188" rx="10" fill="#fff" stroke="#1a7f37" stroke-width="2.5"/><svg x="998" y="324" width="27" height="27" viewBox="0 0 24 24" fill="none" stroke="#1a7f37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 8 3v7c0 5-8 10-8 10S4 17 4 12V5l8-3Z"/><path d="m8 12 3 3 5-7"/></svg><text x="1038" y="344" font-size="21" font-weight="700" fill="#14233a">Required PR impact gate</text><text x="999" y="379" font-size="17" fill="#59697b">Evidence complete? Owners approved?</text><text x="999" y="403" font-size="17" fill="#59697b">Destructive change or unknown → HOLD</text><text x="999" y="427" font-size="17" fill="#59697b">Protected main → versioned release</text><text x="999" y="479" font-size="12" font-weight="700" letter-spacing=".7" fill="#1a7f37">HOLD UNTIL REVIEW</text></g><path d="M48 566H1552" stroke="#d8e0ea"/><text x="48" y="596" font-size="17" fill="#59697b">Failure investigation remains available for red CI. Critical successful changes enter this additional assessment path.</text></svg>