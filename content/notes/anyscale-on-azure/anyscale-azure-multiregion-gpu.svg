<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f6cbd"/>
    </marker>
    <filter id="soft2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0b2540" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1000" height="640" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0b2540">Multi-Region GPU Capacity Aggregation</text>
  <text x="500" y="55" text-anchor="middle" font-size="13.5" fill="#5b6472">One Ray job, pulling GPUs from wherever your Azure footprint actually has them</text>

  <!-- Job box -->
  <rect x="350" y="80" width="300" height="62" rx="10" fill="#eef6ff" stroke="#0f6cbd" stroke-width="1.6" filter="url(#soft2)"/>
  <text x="500" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#0b2540">Single Ray Training Job</text>
  <text x="500" y="123" text-anchor="middle" font-size="11" fill="#3b4554">ray job submit · one entrypoint, one job ID</text>

  <path d="M500,142 L500,170" fill="none" stroke="#0f6cbd" stroke-width="2.2" marker-end="url(#arrow2)"/>

  <!-- Scheduler hub -->
  <rect x="320" y="174" width="360" height="64" rx="12" fill="#0b2540" filter="url(#soft2)"/>
  <text x="500" y="200" text-anchor="middle" font-size="13.5" font-weight="700" fill="#ffffff">Anyscale Runtime Scheduler</text>
  <text x="500" y="219" text-anchor="middle" font-size="11" fill="#bcd4ee">Multi-cluster, multi-region capacity aggregation</text>

  <!-- branches down to 3 regions -->
  <path d="M420,238 C390,260 330,280 280,300" fill="none" stroke="#0f6cbd" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M500,238 L500,300" fill="none" stroke="#0f6cbd" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M580,238 C610,260 670,280 720,300" fill="none" stroke="#0f6cbd" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Region 1: East US -->
  <rect x="60" y="306" width="280" height="220" rx="14" fill="#f4f7fa" stroke="#5b6472" stroke-width="1.4" stroke-dasharray="6,5"/>
  <text x="200" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#3b4554">East US — AKS Cluster</text>
  <text x="200" y="347" text-anchor="middle" font-size="10.5" fill="#8a4a09" font-weight="600">Quota: 8 GPUs available</text>

  <rect x="80" y="360" width="240" height="60" rx="8" fill="#fffaf0" stroke="#c2620a" stroke-width="1.3"/>
  <circle cx="150" cy="382" r="11" fill="#c2620a"/><text x="150" y="386" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">H</text>
  <circle cx="185" cy="382" r="9" fill="#e0883a"/>
  <circle cx="212" cy="382" r="9" fill="#e0883a"/>
  <circle cx="239" cy="382" r="9" fill="#e0883a"/>
  <circle cx="266" cy="382" r="9" fill="#e0883a"/>
  <text x="200" y="407" text-anchor="middle" font-size="10.5" fill="#6b3d10">head + 4 workers</text>

  <text x="200" y="445" text-anchor="middle" font-size="11" fill="#3b4554">Data prep + tokenization</text>
  <rect x="80" y="460" width="240" height="46" rx="8" fill="#ffffff" stroke="#5b6472" stroke-width="1.1"/>
  <text x="200" y="488" text-anchor="middle" font-size="10.5" fill="#5b6472">Standard_NC-series · NVMe scratch</text>

  <!-- Region 2: West Europe -->
  <rect x="360" y="306" width="280" height="220" rx="14" fill="#f4f7fa" stroke="#5b6472" stroke-width="1.4" stroke-dasharray="6,5"/>
  <text x="500" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#3b4554">West Europe — AKS Cluster</text>
  <text x="500" y="347" text-anchor="middle" font-size="10.5" fill="#8a4a09" font-weight="600">Quota: 4 GPUs available</text>

  <rect x="380" y="360" width="240" height="60" rx="8" fill="#fffaf0" stroke="#c2620a" stroke-width="1.3"/>
  <circle cx="460" cy="382" r="11" fill="#c2620a"/><text x="460" y="386" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">H</text>
  <circle cx="495" cy="382" r="9" fill="#e0883a"/>
  <circle cx="522" cy="382" r="9" fill="#e0883a"/>
  <text x="500" y="407" text-anchor="middle" font-size="10.5" fill="#6b3d10">head + 2 workers</text>

  <text x="500" y="445" text-anchor="middle" font-size="11" fill="#3b4554">Distributed fine-tuning</text>
  <rect x="380" y="460" width="240" height="46" rx="8" fill="#ffffff" stroke="#5b6472" stroke-width="1.1"/>
  <text x="500" y="488" text-anchor="middle" font-size="10.5" fill="#5b6472">Standard_ND-series · checkpoint/resume</text>

  <!-- Region 3: Southeast Asia -->
  <rect x="660" y="306" width="280" height="220" rx="14" fill="#f4f7fa" stroke="#5b6472" stroke-width="1.4" stroke-dasharray="6,5"/>
  <text x="800" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#3b4554">Southeast Asia — AKS Cluster</text>
  <text x="800" y="347" text-anchor="middle" font-size="10.5" fill="#8a4a09" font-weight="600">Quota: 6 GPUs available</text>

  <rect x="680" y="360" width="240" height="60" rx="8" fill="#fffaf0" stroke="#c2620a" stroke-width="1.3"/>
  <circle cx="755" cy="382" r="11" fill="#c2620a"/><text x="755" y="386" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">H</text>
  <circle cx="790" cy="382" r="9" fill="#e0883a"/>
  <circle cx="817" cy="382" r="9" fill="#e0883a"/>
  <circle cx="844" cy="382" r="9" fill="#e0883a"/>
  <text x="800" y="407" text-anchor="middle" font-size="10.5" fill="#6b3d10">head + 3 workers</text>

  <text x="800" y="445" text-anchor="middle" font-size="11" fill="#3b4554">Batch inference / eval</text>
  <rect x="680" y="460" width="240" height="46" rx="8" fill="#ffffff" stroke="#5b6472" stroke-width="1.1"/>
  <text x="800" y="488" text-anchor="middle" font-size="10.5" fill="#5b6472">Standard_NC-series · MIG-sliced</text>

  <!-- bottom unifying strip -->
  <rect x="60" y="552" width="880" height="60" rx="12" fill="#0b2540"/>
  <text x="500" y="577" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">One logical capacity pool — 18 GPUs across 3 regions, 1 job ID, 1 set of credentials</text>
  <text x="500" y="596" text-anchor="middle" font-size="10.8" fill="#bcd4ee">No more sizing the training plan around a single cluster's quota</text>

  <path d="M200,526 L200,552" fill="none" stroke="#5b6472" stroke-width="1.6" stroke-dasharray="3,3"/>
  <path d="M500,526 L500,552" fill="none" stroke="#5b6472" stroke-width="1.6" stroke-dasharray="3,3"/>
  <path d="M800,526 L800,552" fill="none" stroke="#5b6472" stroke-width="1.6" stroke-dasharray="3,3"/>

</svg>
