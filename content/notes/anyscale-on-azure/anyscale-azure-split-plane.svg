<svg viewBox="0 0 1040 600" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2620a"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0b2540" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1040" height="600" fill="#ffffff"/>

  <text x="520" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#0b2540">Anyscale on Azure — Split-Plane Architecture</text>
  <text x="520" y="55" text-anchor="middle" font-size="13.5" fill="#5b6472">Control plane managed by Anyscale · Data plane stays inside your Azure subscription</text>

  <!-- Tenant boundary: Anyscale -->
  <rect x="30" y="80" width="420" height="480" rx="14" fill="#eef6ff" stroke="#0f6cbd" stroke-width="1.6" stroke-dasharray="6,5"/>
  <text x="50" y="107" font-size="14" font-weight="700" fill="#0f6cbd">ANYSCALE-HOSTED AZURE TENANT</text>
  <text x="50" y="124" font-size="12" fill="#3b4554">Control plane</text>

  <rect x="50" y="140" width="380" height="62" rx="10" fill="#ffffff" stroke="#0f6cbd" stroke-width="1.4" filter="url(#soft)"/>
  <text x="240" y="165" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2540">Anyscale Console</text>
  <text x="240" y="183" text-anchor="middle" font-size="11.5" fill="#5b6472">console.azure.anyscale.com · Entra ID SSO</text>

  <rect x="50" y="216" width="380" height="62" rx="10" fill="#ffffff" stroke="#0f6cbd" stroke-width="1.4" filter="url(#soft)"/>
  <text x="240" y="241" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2540">Scheduling &amp; Job Management API</text>
  <text x="240" y="259" text-anchor="middle" font-size="11.5" fill="#5b6472">CLI · SDK · REST</text>

  <rect x="50" y="292" width="380" height="62" rx="10" fill="#ffffff" stroke="#0f6cbd" stroke-width="1.4" filter="url(#soft)"/>
  <text x="240" y="317" text-anchor="middle" font-size="14" font-weight="600" fill="#0b2540">Monitoring &amp; Metrics</text>
  <text x="240" y="335" text-anchor="middle" font-size="11.5" fill="#5b6472">Logs, telemetry, Grafana dashboards</text>

  <rect x="50" y="400" width="380" height="140" rx="10" fill="#fff7ed" stroke="#c2620a" stroke-width="1.3"/>
  <text x="240" y="427" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4a09">Never reaches into your cluster</text>
  <text x="240" y="450" text-anchor="middle" font-size="12" fill="#6b3d10">The control plane issues instructions,</text>
  <text x="240" y="468" text-anchor="middle" font-size="12" fill="#6b3d10">but it never opens a connection into</text>
  <text x="240" y="486" text-anchor="middle" font-size="12" fill="#6b3d10">your AKS cluster. Your operator polls</text>
  <text x="240" y="504" text-anchor="middle" font-size="12" fill="#6b3d10">it — every hop starts from your side.</text>
  <text x="240" y="525" text-anchor="middle" font-size="11.5" font-weight="600" fill="#8a4a09">No inbound firewall rules required.</text>

  <!-- Tenant boundary: Customer -->
  <rect x="500" y="80" width="510" height="480" rx="14" fill="#f4f7fa" stroke="#5b6472" stroke-width="1.6" stroke-dasharray="6,5"/>
  <text x="520" y="107" font-size="14" font-weight="700" fill="#3b4554">YOUR AZURE SUBSCRIPTION</text>
  <text x="520" y="124" font-size="12" fill="#5b6472">Data plane — running on your AKS cluster</text>

  <rect x="520" y="140" width="200" height="68" rx="10" fill="#ffffff" stroke="#3b4554" stroke-width="1.4" filter="url(#soft)"/>
  <text x="620" y="167" text-anchor="middle" font-size="13.5" font-weight="600" fill="#0b2540">Anyscale Operator</text>
  <text x="620" y="185" text-anchor="middle" font-size="11" fill="#5b6472">AKS extension · polling loop</text>

  <rect x="740" y="140" width="250" height="68" rx="10" fill="#ffffff" stroke="#3b4554" stroke-width="1.4" filter="url(#soft)"/>
  <text x="865" y="162" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0b2540">Managed Identities</text>
  <text x="865" y="179" text-anchor="middle" font-size="10.8" fill="#5b6472">Operator identity + cluster identity</text>
  <text x="865" y="195" text-anchor="middle" font-size="10.8" fill="#5b6472">Entra workload identity (OIDC)</text>

  <!-- Ray cluster 1 -->
  <rect x="520" y="228" width="225" height="148" rx="10" fill="#fffaf0" stroke="#c2620a" stroke-width="1.4" filter="url(#soft)"/>
  <text x="632" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4a09">Ray Cluster A</text>
  <circle cx="565" cy="280" r="13" fill="#c2620a"/>
  <text x="565" y="284" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="700">H</text>
  <text x="565" y="305" text-anchor="middle" font-size="10" fill="#6b3d10">head</text>
  <circle cx="610" cy="280" r="11" fill="#e0883a"/>
  <circle cx="652" cy="280" r="11" fill="#e0883a"/>
  <circle cx="694" cy="280" r="11" fill="#e0883a"/>
  <text x="652" y="305" text-anchor="middle" font-size="10" fill="#6b3d10">GPU workers</text>
  <text x="632" y="335" text-anchor="middle" font-size="10.5" fill="#6b3d10">Training / fine-tuning job</text>
  <text x="632" y="352" text-anchor="middle" font-size="10.5" fill="#6b3d10">Checkpoint + mid-epoch resume</text>

  <!-- Ray cluster 2 -->
  <rect x="765" y="228" width="225" height="148" rx="10" fill="#fffaf0" stroke="#c2620a" stroke-width="1.4" filter="url(#soft)"/>
  <text x="877" y="251" text-anchor="middle" font-size="13" font-weight="700" fill="#8a4a09">Ray Cluster B</text>
  <circle cx="810" cy="280" r="13" fill="#c2620a"/>
  <text x="810" y="284" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="700">H</text>
  <text x="810" y="305" text-anchor="middle" font-size="10" fill="#6b3d10">head</text>
  <circle cx="855" cy="280" r="11" fill="#e0883a"/>
  <circle cx="897" cy="280" r="11" fill="#e0883a"/>
  <circle cx="939" cy="280" r="11" fill="#e0883a"/>
  <text x="897" y="305" text-anchor="middle" font-size="10" fill="#6b3d10">GPU workers</text>
  <text x="877" y="335" text-anchor="middle" font-size="10.5" fill="#6b3d10">Batch inference / serving</text>
  <text x="877" y="352" text-anchor="middle" font-size="10.5" fill="#6b3d10">Anyscale Runtime engine</text>

  <!-- Azure services row -->
  <rect x="520" y="400" width="150" height="76" rx="10" fill="#ffffff" stroke="#3b4554" stroke-width="1.3" filter="url(#soft)"/>
  <text x="595" y="427" text-anchor="middle" font-size="12" font-weight="600" fill="#0b2540">Blob / ADLS</text>
  <text x="595" y="445" text-anchor="middle" font-size="10.5" fill="#5b6472">Datasets, checkpoints</text>

  <rect x="685" y="400" width="150" height="76" rx="10" fill="#ffffff" stroke="#3b4554" stroke-width="1.3" filter="url(#soft)"/>
  <text x="760" y="427" text-anchor="middle" font-size="12" font-weight="600" fill="#0b2540">ACR</text>
  <text x="760" y="445" text-anchor="middle" font-size="10.5" fill="#5b6472">Custom Ray images</text>

  <rect x="850" y="400" width="140" height="76" rx="10" fill="#ffffff" stroke="#3b4554" stroke-width="1.3" filter="url(#soft)"/>
  <text x="920" y="427" text-anchor="middle" font-size="12" font-weight="600" fill="#0b2540">Load Balancer</text>
  <text x="920" y="445" text-anchor="middle" font-size="10.5" fill="#5b6472">L4 ingress to head pods</text>

  <!-- Entra ID / RBAC strip -->
  <rect x="520" y="495" width="470" height="50" rx="10" fill="#f0f0f5" stroke="#5b6472" stroke-width="1.2"/>
  <text x="755" y="516" text-anchor="middle" font-size="12.5" font-weight="600" fill="#3b4554">Microsoft Entra ID + Azure RBAC</text>
  <text x="755" y="533" text-anchor="middle" font-size="10.5" fill="#5b6472">Same identity, same audit trail as the rest of your subscription</text>

  <!-- Arrows: operator polling control plane, contained in the gap corridor -->
  <text x="476" y="113" text-anchor="middle" font-size="10.3" fill="#3b4554" font-weight="600">outbound</text>
  <text x="476" y="126" text-anchor="middle" font-size="10.3" fill="#3b4554" font-weight="600">only</text>
  <path d="M520,174 L432,174" fill="none" stroke="#5b6472" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="476" y="148" text-anchor="middle" font-size="10" fill="#3b4554">polls for</text>
  <text x="476" y="160" text-anchor="middle" font-size="10" fill="#3b4554">instructions</text>

  <!-- operator manages ray clusters -->
  <path d="M610,208 L610,228" fill="none" stroke="#c2620a" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M660,208 C700,212 730,216 760,222" fill="none" stroke="#c2620a" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="700" y="219" text-anchor="middle" font-size="10.3" fill="#8a4a09">deploys &amp; manages</text>

</svg>
